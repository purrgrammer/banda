apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

import groovy.json.JsonSlurper

// One version for the daemon, the app and the phone's shell: banda's package.json says it. The release workflow gives
// each build a growing code (BANDA_VERSION_CODE), so a newer APK installs over the one before.
def bandaVersion = new JsonSlurper().parse(file('../../../package.json')).version
def bandaVersionCode = (System.getenv('BANDA_VERSION_CODE') ?: '1') as Integer
// A release APK is signed with banda's own key, from the environment and never from a file in the repo: an APK signed
// with any other key cannot install over it. Without the key, a release build is unsigned.
def signingKey = System.getenv('BANDA_ANDROID_KEYSTORE')

android {
    namespace = "app.banda"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.banda"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode bandaVersionCode
        versionName bandaVersion
        // Android only, arm64 only for now: phones, and the arm64 emulator
        ndk { abiFilters 'arm64-v8a' }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (signingKey) {
            banda {
                storeFile file(signingKey)
                storePassword System.getenv('BANDA_ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('BANDA_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('BANDA_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            if (signingKey) signingConfig signingConfigs.banda
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    packaging {
        // the iroh library is loaded by name (System.loadLibrary), so it is stored uncompressed and aligned
        jniLibs { useLegacyPackaging = false }
        // iroh-android's jar also carries the desktop builds as JNA resources (for JVM unit tests on a computer);
        // a phone never loads them. This only shapes the APK: the unit tests' classpath still has them.
        resources { excludes += ['win32-*/**', 'darwin-*/**', 'linux-*/**'] }
    }
}

kotlin { jvmToolchain(21) }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // to tell whether the WebView hears the main frame alone (as Capacitor's own bridge does)
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    // iroh's official Android bindings (iroh-ffi): the Kotlin API and libiroh_ffi.so per ABI, as the daemon's 1.2.0
    implementation 'computer.iroh:iroh-android:1.2.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation project(':capacitor-cordova-android-plugins')
    testImplementation "junit:junit:$junitVersion"
}

apply from: 'capacitor.build.gradle'
