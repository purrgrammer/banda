# Ordinary checks on pushes and PRs; fault sweeps nightly; the box suites on main pushes, on the computer banda ships
# (a microVM, on this runner's KVM) and again on Docker. Manual CI runs provide the expensive suites without occupying
# local development machines.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 2 * * *" # nightly at 02:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # anvil, for the wallet's chain suites (they skip without it): mise.toml pins foundry. It runs before setup-node,
      # so setup-node's node comes first on PATH
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.11.5
          install_args: foundry
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run web:contrast
      - run: npm run typecheck
      # the desktop app's main process and preloads, otherwise typechecked only when the release workflow packs it
      - run: npm --prefix desktop ci --ignore-scripts
      - run: npx --no-install tsc -p tsconfig.json --noEmit
        working-directory: desktop
      - run: npm run test:fast
      - run: npm run build

  # The supply-chain checks of docs/wallets/stack.md section 5, on each change and nightly: an advisory can be published
  # for a version already pinned. The release workflow runs them too, and publishes nothing without them.
  supply-chain:
    uses: ./.github/workflows/supply-chain.yml

  faults:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # one sweep can take minutes on a CI runner, so the suite is split by file across runners side by side
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    name: faults (${{ matrix.shard }}/6)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:faults -- --shard=${{ matrix.shard }}/6

  docker:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # lets buildx reach GitHub's cache service
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - run: npm ci --ignore-scripts
      - run: node scripts/prebuild-images.ts
        env:
          BANDA_IMAGE_CACHE: gha
      - run: npm run test:docker

  # The box suites on the computer banda ships: its development bundle built as a release stages it (the native runtime
  # from its cache), KVM opened to this account alone, and the suites' stand-in site at a public address routed nowhere,
  # on a dummy interface, with its names in /etc/hosts (test/fixtures/site-names.ts). A suite whose box is missing fails.
  computer:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      BANDA_TEST_SITE: 11.77.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Restore the native runtime build
        id: native-runtime-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: release/cache/computer/runtime
          key: native-runtime-linux-x64-${{ hashFiles('scripts/microvm-runtime.*', 'src/box/microvm-assets.ts') }}
      - run: npm ci --ignore-scripts
      - name: Prepare the development computer
        run: node scripts/microvm-bundle.ts --prepare
      - name: Keep the native runtime build
        if: steps.native-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: release/cache/computer/runtime
          key: native-runtime-linux-x64-${{ hashFiles('scripts/microvm-runtime.*', 'src/box/microvm-assets.ts') }}
      # The computer's box image carries no git: the git suite puts one in /tools, as an agent installs it there.
      - name: Stage git for the computer's /tools
        run: sh test/fixtures/box-git.sh "$(node -p 'require("./computer/manifest.json").box.ref')" "$RUNNER_TEMP/box-tools"
      # As the release verifies the computer: this account joins the kvm group, and the suites run in a fresh session
      # that has it. An ACL on /dev/kvm is not enough on this runner (the release's start diagnostic: the ACL arm's
      # machine aborts before its relay, the group arm's starts).
      - name: Give this account the kvm group
        run: |
          test -c /dev/kvm
          getent group kvm
          sudo -n /usr/sbin/usermod -aG kvm "$(id -un)"
          sudo -n -u "$(id -un)" -- /usr/bin/env -i PATH=/usr/bin:/bin "$(command -v node)" -e '
            const { accessSync, constants } = require("node:fs");
            accessSync("/dev/kvm", constants.R_OK | constants.W_OK);
            console.log("a fresh session opens /dev/kvm; groups:", require("node:child_process").execFileSync("/usr/bin/id", ["-nG"], { encoding: "utf8" }).trim());
          '
      - name: Put the stand-in site on a public address routed nowhere
        run: |
          sudo ip link add banda-site type dummy
          sudo ip address add "$BANDA_TEST_SITE/32" dev banda-site
          sudo ip link set banda-site up
          node test/fixtures/site-names.ts "$BANDA_TEST_SITE" | sudo tee -a /etc/hosts
          getent hosts echo.banda-site.example
          resolvectl query echo.banda-site.example || true
      - run: mkdir -p "$RUNNER_TEMP/computer-evidence"
      - name: The box suites on the computer, in a session with the kvm group
        run: |
          sudo -n -u "$(id -un)" -- /usr/bin/env -i \
            "PATH=$(dirname "$(command -v node)"):/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin" \
            "HOME=$HOME" LANG=C.UTF-8 CI=true GITHUB_ACTIONS=true "BANDA_TEST_SITE=$BANDA_TEST_SITE" \
            "BANDA_TEST_BOX_TOOLS=$RUNNER_TEMP/box-tools" \
            npm run test:computer -- --reporter=default --reporter=junit --outputFile.junit="$RUNNER_TEMP/computer-evidence/junit.xml"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: computer-evidence
          path: ${{ runner.temp }}/computer-evidence
          if-no-files-found: ignore
