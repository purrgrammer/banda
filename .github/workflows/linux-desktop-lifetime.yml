name: Linux desktop lifetime experiment

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - .github/workflows/linux-desktop-lifetime.yml
      - scripts/diagnose-linux-desktop-lifetime.ts
      - scripts/native-diagnostics.ts
      - scripts/verify-linux-computer.ts
      - package-lock.json

permissions:
  contents: read

jobs:
  inert-lifetime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Observe inert main exits and detached descendants
        run: node scripts/diagnose-linux-desktop-lifetime.ts "$RUNNER_TEMP/lifetime-proof"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-desktop-lifetime
          path: ${{ runner.temp }}/lifetime-proof
          if-no-files-found: ignore
