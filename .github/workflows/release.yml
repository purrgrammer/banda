# Manual runs build platform candidates. Tags draft release metadata; accepted artifacts and their matching
# source/notice materials are attached separately so CI cannot replace a verified release with another build.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      native_computer:
        description: Verify the staged Linux computer through the app (requires KVM and Chrome on the runner)
        type: boolean
        default: false
      linux_start_diagnostic:
        description: Diagnose the owned Linux x64 startup abort; does not qualify or publish a release
        type: boolean
        default: false
      public_delivery:
        description: Verify the accepted alpha.12 public downloads and source/notice materials without rebuilding or publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  computer-images:
    if: github.event_name == 'workflow_dispatch' && inputs.linux_start_diagnostic != true && inputs.public_delivery != true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, runner: ubuntu-24.04-arm }
          - { arch: x64, runner: ubuntu-latest }
    name: build computer images (linux-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: node scripts/microvm-bundle.ts --images --arch ${{ matrix.arch }} --out release/computer-images
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: computer-images-${{ matrix.arch }}
          path: release/computer-images
          if-no-files-found: error
          compression-level: 0

  build:
    needs: computer-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, target: mac-arm64, computer: arm64 }
          - { runner: windows-latest, target: win-x64, computer: "" }
          - { runner: ubuntu-latest, target: linux-x64, computer: x64 }
          - { runner: ubuntu-24.04-arm, target: linux-arm64, computer: arm64 }
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Cache verified native compiler inputs and Cargo intermediates
        if: matrix.computer != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: release/cache/computer/runtime
          key: native-runtime-${{ matrix.target }}-${{ hashFiles('scripts/microvm-runtime.*', 'src/box/microvm-assets.ts') }}
      - run: npm ci
      # once, on Linux, as CI runs them; every target proves its own build with the smoke run below
      - name: Format, lint, types and the ordinary suites
        if: matrix.target == 'linux-x64'
        run: npm run check && npm run typecheck && npm run test:fast
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.computer != ''
        with:
          name: computer-images-${{ matrix.computer }}
          path: ${{ runner.temp }}/computer-images
      - run: npm run cli:pack
        env:
          BANDA_COMPUTER_IMAGES: ${{ matrix.computer != '' && format('{0}/computer-images', runner.temp) || '' }}
      - run: node scripts/smoke-release.ts
      - name: Prepare native Linux KVM access
        if: inputs.native_computer && startsWith(matrix.target, 'linux-')
        run: |
          if [ ! -c /dev/kvm ]; then
            echo "::error::Native Linux qualification requires /dev/kvm. This runner has no KVM device; Linux remains unqualified."
            exit 1
          fi
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            sudo setfacl -m "u:$(id -u):rw" /dev/kvm
          fi
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::Native Linux qualification cannot access /dev/kvm after granting the runner account access."
            exit 1
          fi
      - name: Prepare the native Linux acceptance browser
        id: native-chrome
        if: inputs.native_computer && startsWith(matrix.target, 'linux-')
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: "157.0.8103.78"
          install-dependencies: true
      - name: Verify the native Linux computer through the app
        if: inputs.native_computer && startsWith(matrix.target, 'linux-')
        env:
          CHROME: ${{ steps.native-chrome.outputs.chrome-path }}
        run: |
          "$CHROME" --version
          node scripts/verify-computer.ts "${{ runner.temp }}/native-computer-evidence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && inputs.native_computer && startsWith(matrix.target, 'linux-')
        with:
          name: native-computer-${{ matrix.target }}
          path: ${{ runner.temp }}/native-computer-evidence
          if-no-files-found: ignore
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop run dist
        env:
          # unsigned pre-release: never pick up a certificate from the runner's keychain
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: banda-${{ matrix.target }}
          if-no-files-found: error
          path: |
            release/banda-cli-*
            release/banda-browser-*.tar
            release/desktop/banda-*.dmg
            release/desktop/banda-*.zip
            release/desktop/banda-*.exe
            release/desktop/banda-*.AppImage
            release/desktop/banda-*.deb

  # The phone's shell: one APK for arm64 Android phones, built on Linux (the runner's Android SDK; Gradle fetches the
  # Java it needs). A tag's APK is signed with banda's key from the repository's secrets, so each release installs over
  # the one before; a manual run without the key uploads an unsigned APK, to try the build and nothing more.
  android:
    if: github.event_name == 'workflow_dispatch' && inputs.linux_start_diagnostic != true && inputs.public_delivery != true
    name: build (android-arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - name: The tag names the version being built
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # this job holds no secret: npm's install scripts and Gradle's plugins run here, so the key never does
      - run: npm ci
      - run: npm run mobile:apk:release
        env:
          BANDA_VERSION_CODE: ${{ github.run_number }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unsigned
          if-no-files-found: error
          path: mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk

  # Signs the APK the android job built, with banda's key, in a job that runs no third-party code: no npm, no Gradle,
  # only the runner's own Android build tools. One compromised dependency must not be able to take the key.
  android-sign:
    name: sign (android-arm64)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-unsigned
          path: unsigned
      - name: Sign with banda's key, or name it unsigned when no key is set
        env:
          KEYSTORE: ${{ secrets.BANDA_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BANDA_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BANDA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BANDA_ANDROID_KEY_PASSWORD }}
        run: |
          version=$(jq -r .version package.json)
          mkdir -p release
          if [ -z "$KEYSTORE" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::a release APK must be signed: set BANDA_ANDROID_KEYSTORE_BASE64 and its passwords"
              exit 1
            fi
            echo "no signing key: this run's APK is unsigned"
            cp unsigned/app-release-unsigned.apk "release/banda-$version-android-arm64-unsigned.apk"
            exit 0
          fi
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          keystore="$RUNNER_TEMP/banda.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE" | base64 -d > "$keystore"
          "$tools/zipalign" -P 16 -f 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          out="release/banda-$version-android-arm64.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$out" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --print-certs "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: banda-android-arm64
          if-no-files-found: error
          path: release/banda-*-android-arm64*.apk

  linux-start-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.linux_start_diagnostic && inputs.public_delivery != true
    name: diagnose Linux x64 startup (not qualification)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Verify the retained image run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: test "$(gh api "repos/$GH_REPO/actions/runs/43462401258" --jq .head_sha)" = 1cbab783d4996e6d12e0e858bc5c6c2a72dd073c
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: computer-images-x64
          path: ${{ runner.temp }}/computer-images
          run-id: 43462401258
          github-token: ${{ github.token }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: release/cache/computer/runtime
          key: native-runtime-linux-x64-${{ hashFiles('scripts/microvm-runtime.*', 'src/box/microvm-assets.ts') }}
      - run: npm ci
      - run: npm run build
      - name: Stage the source-built runtime with verified retained images
        run: node scripts/stage.ts
        env:
          BANDA_COMPUTER_IMAGES: ${{ runner.temp }}/computer-images
      - name: Require native KVM access
        run: |
          test -c /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            sudo setfacl -m "u:$(id -u):rw" /dev/kvm
          fi
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install the startup syscall tracer
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends strace
      - name: Capture startup evidence while preserving the original failure
        run: node scripts/diagnose-linux-start.ts --out "$RUNNER_TEMP/native-start-diagnostic" --run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-x64-start-diagnostic
          path: ${{ runner.temp }}/native-start-diagnostic
          if-no-files-found: ignore

  public-delivery:
    if: github.event_name == 'workflow_dispatch' && inputs.public_delivery
    name: verify accepted alpha.12 public delivery
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify the checkers without network requests
        run: |
          env -i PATH="$PATH" node scripts/verify-public-delivery.test.mjs
          env -i PATH="$PATH" python3 scripts/verify-public-delivery-consumer.test.py
      - name: GET and hash all 15 accepted public release assets
        run: env -i PATH="$PATH" node scripts/verify-public-delivery.mjs --out "$GITHUB_WORKSPACE/scripts/public-delivery-download" --run
      - name: Reconstruct the accepted sources and verify notice origins
        run: env -i PATH="$PATH" python3 scripts/verify-public-delivery-consumer.py --delivery "$GITHUB_WORKSPACE/scripts/public-delivery-download" --out "$GITHUB_WORKSPACE/scripts/public-delivery-consumer"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: public-delivery-alpha12-evidence
          if-no-files-found: ignore
          path: |
            scripts/public-delivery-download/result.json
            scripts/public-delivery-consumer/result.json
            scripts/public-delivery-consumer/source.log
            scripts/public-delivery-consumer/notices.log

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && inputs.public_delivery != true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag names the version being released
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release exists; its accepted artifacts are unchanged."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --draft --prerelease --verify-tag \
            --title "banda $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
