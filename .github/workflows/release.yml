# Manual runs build platform candidates. A tag builds every target and publishes the pre-release with the supported
# ones' downloads; a release that already exists is never replaced by another build.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_target:
        description: Choose the platform candidates to build
        type: choice
        default: all
        options:
          - all
          - linux-x64
      native_computer:
        description: Verify the staged Linux computer through the app (requires KVM and Chrome on the runner)
        type: boolean
        default: false
      linux_start_diagnostic:
        description: Diagnose the owned Linux x64 startup abort; does not qualify or publish a release
        type: boolean
        default: false
      public_delivery:
        description: Verify the accepted alpha.12 public downloads and source/notice materials without rebuilding or publishing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  computer-images:
    if: github.event_name == 'push' || (inputs.linux_start_diagnostic != true && inputs.public_delivery != true)
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.build_target == 'linux-x64' && '[{"arch":"x64","runner":"ubuntu-latest"}]' || '[{"arch":"arm64","runner":"ubuntu-24.04-arm"},{"arch":"x64","runner":"ubuntu-latest"}]') }}
    name: build computer images (linux-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/microvm-bundle.ts --images --arch ${{ matrix.arch }} --out release/computer-images
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: computer-images-${{ matrix.arch }}
          path: release/computer-images
          if-no-files-found: error
          compression-level: 0

  build:
    needs: computer-images
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.build_target == 'linux-x64' && '[{"runner":"ubuntu-latest","target":"linux-x64","computer":"x64"}]' || '[{"runner":"macos-latest","target":"mac-arm64","computer":"arm64"},{"runner":"windows-latest","target":"win-x64","computer":""},{"runner":"ubuntu-latest","target":"linux-x64","computer":"x64"},{"runner":"ubuntu-24.04-arm","target":"linux-arm64","computer":"arm64"}]') }}
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Cache verified native compiler inputs and Cargo intermediates
        id: native-runtime-cache
        if: matrix.computer != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: release/cache/computer/runtime
          key: native-runtime-${{ matrix.target }}-${{ hashFiles('scripts/microvm-runtime.*', 'src/box/microvm-assets.ts') }}
      - run: npm ci --ignore-scripts
      - name: Prepare the Linux test browser
        id: native-chrome
        if: matrix.target == 'linux-x64' || (inputs.native_computer && startsWith(matrix.target, 'linux-'))
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: "157.0.8103.78"
          install-dependencies: true
      - name: Install the Linux test browser with scoped user namespaces
        id: installed-chrome
        if: matrix.target == 'linux-x64' || (inputs.native_computer && startsWith(matrix.target, 'linux-'))
        env:
          CHROME_SOURCE: ${{ steps.native-chrome.outputs.chrome-path }}
        run: |
          mkdir "$RUNNER_TEMP/browser-setup"
          sudo /bin/bash -euxo pipefail -s -- "$CHROME_SOURCE" "$RUNNER_TOOL_CACHE" "$RUNNER_ARCH" <<'BASH' 2>&1 | tee "$RUNNER_TEMP/browser-setup/install.log"
          source=$1
          case "$3" in
            X64) architecture=x64 ;;
            ARM64) architecture=arm64 ;;
            *) exit 1 ;;
          esac
          expected="$2/setup-chrome/chrome/157.0.8103.78/$architecture/chrome"
          installation=/usr/lib/banda-ci-chrome
          profile=/etc/apparmor.d/banda-ci-chrome
          test "$source" = "$expected"
          test "$(realpath -e -- "$source")" = "$source"
          test -f "$source"
          test ! -L "$source"
          test -x "$source"
          source_directory=$(dirname -- "$source")
          unexpected=$(find "$source_directory" ! -type d ! -type f -print -quit)
          test -z "$unexpected"
          privileged=$(find "$source_directory" -perm /6000 -print -quit)
          test -z "$privileged"
          for directory in / /usr /usr/lib /etc /etc/apparmor.d; do
            test -d "$directory"
            test ! -L "$directory"
            test "$(stat -c %u "$directory")" = 0
            mode=$(stat -c %a "$directory")
            test "$((8#$mode & 0022))" = 0
          done
          test ! -e "$installation"
          test ! -L "$installation"
          test ! -e "$profile"
          test ! -L "$profile"
          restrictions=(
            /proc/sys/kernel/apparmor_restrict_unprivileged_userns
            /proc/sys/kernel/apparmor_restrict_unprivileged_unconfined
            /proc/sys/kernel/unprivileged_userns_clone
            /proc/sys/user/max_user_namespaces
          )
          before=$(sha256sum "${restrictions[@]}")
          printf '%s\n' "$before"
          for setting in "${restrictions[@]}"; do
            printf '%s=' "$setting"
            cat "$setting"
          done
          source_sha=$(sha256sum "$source" | cut -d ' ' -f 1)
          mkdir -m 0700 "$installation"
          find "$source_directory" -mindepth 1 -maxdepth 1 -exec \
            cp -R --preserve=mode,timestamps --no-preserve=ownership -t "$installation" -- {} +
          chown -R root:root "$installation"
          chmod -R go-w "$installation"
          chmod 0755 "$installation"
          test "$(sha256sum "$installation/chrome" | cut -d ' ' -f 1)" = "$source_sha"
          cmp "$source" "$installation/chrome"
          unsafe=$(find "$installation" \( ! -user root -o -perm /6022 \) -print -quit)
          test -z "$unsafe"
          umask 022
          set -o noclobber
          cat > "$profile" <<'PROFILE'
          abi <abi/4.0>,
          profile banda-ci-chrome /usr/lib/banda-ci-chrome/chrome flags=(unconfined) {
            userns,
          }
          PROFILE
          chmod 0644 "$profile"
          cat "$profile"
          sha256sum "$source" "$installation/chrome" "$profile"
          stat -c '%n uid=%u gid=%g mode=%a' "$installation" "$installation/chrome" "$profile"
          /sbin/apparmor_parser --add "$profile"
          test "$(sha256sum "${restrictions[@]}")" = "$before"
          BASH
          echo 'chrome-path=/usr/lib/banda-ci-chrome/chrome' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && (matrix.target == 'linux-x64' || (inputs.native_computer && startsWith(matrix.target, 'linux-')))
        with:
          name: browser-setup-${{ matrix.target }}
          path: ${{ runner.temp }}/browser-setup
          if-no-files-found: ignore
      - name: Preserve Linux browser startup evidence
        if: matrix.target == 'linux-x64' || (inputs.native_computer && startsWith(matrix.target, 'linux-'))
        env:
          CHROME: ${{ steps.installed-chrome.outputs.chrome-path }}
        run: node scripts/verify-linux-browser.ts "$RUNNER_TEMP/browser-preflight"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && (matrix.target == 'linux-x64' || (inputs.native_computer && startsWith(matrix.target, 'linux-')))
        with:
          name: browser-preflight-${{ matrix.target }}
          path: ${{ runner.temp }}/browser-preflight
          if-no-files-found: ignore
      # once, on Linux, as CI runs them; every target proves its own build with the smoke run below
      - name: Format, lint, types and the ordinary suites
        if: matrix.target == 'linux-x64'
        env:
          CHROME: ${{ steps.installed-chrome.outputs.chrome-path }}
        run: |
          "$CHROME" --version
          npm run check && npm run typecheck && npm run test:fast
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.computer != ''
        with:
          name: computer-images-${{ matrix.computer }}
          path: ${{ runner.temp }}/computer-images
      - run: npm run cli:pack
        env:
          BANDA_COMPUTER_IMAGES: ${{ matrix.computer != '' && format('{0}/computer-images', runner.temp) || '' }}
      - name: Retain the verified native build before package diagnostics
        if: matrix.computer != '' && steps.native-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: release/cache/computer/runtime
          key: native-runtime-${{ matrix.target }}-${{ hashFiles('scripts/microvm-runtime.*', 'src/box/microvm-assets.ts') }}
      - run: node scripts/smoke-release.ts
      - name: Verify the native Linux computer through the app
        if: inputs.native_computer && startsWith(matrix.target, 'linux-')
        env:
          CHROME: ${{ steps.installed-chrome.outputs.chrome-path }}
          BANDA_RELEASE_ROOT: ${{ github.workspace }}/release/banda
        run: |
          "$CHROME" --version
          node scripts/verify-linux-computer.ts "$RUNNER_TEMP/native-computer-evidence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && inputs.native_computer && startsWith(matrix.target, 'linux-')
        with:
          name: native-computer-${{ matrix.target }}
          path: ${{ runner.temp }}/native-computer-evidence
          if-no-files-found: ignore
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop run dist
        id: desktop_package
        env:
          # unsigned pre-release: never pick up a certificate from the runner's keychain
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify Debian package dependencies in a clean Debian root
        if: matrix.target == 'linux-x64'
        run: |
          packages=(release/desktop/banda-*-linux-amd64.deb)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          node scripts/verify-linux-package.ts "${packages[0]}" "$RUNNER_TEMP/linux-package-dependencies"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.target == 'linux-x64'
        with:
          name: linux-package-dependencies-${{ matrix.target }}
          path: ${{ runner.temp }}/linux-package-dependencies
          if-no-files-found: ignore
      - name: Diagnose the installed Linux shell
        if: always() && inputs.native_computer && matrix.target == 'linux-x64' && steps.desktop_package.outcome == 'success'
        run: |
          packages=("$GITHUB_WORKSPACE"/release/desktop/banda-*-linux-amd64.deb)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          node scripts/diagnose-linux-desktop.ts "${packages[0]}" "$RUNNER_TEMP/linux-desktop-shell"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && inputs.native_computer && matrix.target == 'linux-x64'
        with:
          name: linux-desktop-shell-${{ matrix.target }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/linux-desktop-shell/*.json
            ${{ runner.temp }}/linux-desktop-shell/*.png
            ${{ runner.temp }}/linux-desktop-shell/home/.banda/daemon.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && steps.desktop_package.outcome == 'success' }}
        with:
          name: banda-${{ matrix.target }}
          if-no-files-found: error
          path: |
            release/banda-cli-*
            release/banda-browser-*.tar
            release/desktop/banda-*.dmg
            release/desktop/banda-*.zip
            release/desktop/banda-*.exe
            release/desktop/banda-*.deb

  # The phone's shell: one APK for arm64 Android phones, built on Linux (the runner's Android SDK; Gradle fetches the
  # Java it needs). A tag's APK is signed with banda's key from the repository's secrets, so each release installs over
  # the one before; a manual run without the key uploads an unsigned APK, to try the build and nothing more.
  android:
    if: github.event_name == 'push' || (inputs.linux_start_diagnostic != true && inputs.public_delivery != true && inputs.build_target != 'linux-x64')
    name: build (android-arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - name: The tag names the version being built
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # this job holds no secret: the mobile tree's install scripts (its `npm ci` in mobile:apk:release) and Gradle's
      # plugins run here, so the key never does
      - run: npm ci --ignore-scripts
      - run: npm run mobile:apk:release
        env:
          BANDA_VERSION_CODE: ${{ github.run_number }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-unsigned
          if-no-files-found: error
          path: mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk

  # Signs the APK the android job built, with banda's key, in a job that runs no third-party code: no npm, no Gradle,
  # only the runner's own Android build tools. One compromised dependency must not be able to take the key.
  android-sign:
    name: sign (android-arm64)
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-unsigned
          path: unsigned
      - name: Sign with banda's key, or name it unsigned when no key is set
        env:
          KEYSTORE: ${{ secrets.BANDA_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BANDA_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BANDA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BANDA_ANDROID_KEY_PASSWORD }}
        run: |
          version=$(jq -r .version package.json)
          mkdir -p release
          if [ -z "$KEYSTORE" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::a release APK must be signed: set BANDA_ANDROID_KEYSTORE_BASE64 and its passwords"
              exit 1
            fi
            echo "no signing key: this run's APK is unsigned"
            cp unsigned/app-release-unsigned.apk "release/banda-$version-android-arm64-unsigned.apk"
            exit 0
          fi
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          keystore="$RUNNER_TEMP/banda.jks"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE" | base64 -d > "$keystore"
          "$tools/zipalign" -P 16 -f 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          out="release/banda-$version-android-arm64.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$out" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --print-certs "$out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: banda-android-arm64
          if-no-files-found: error
          path: release/banda-*-android-arm64*.apk

  linux-start-diagnostic:
    if: github.event_name == 'workflow_dispatch' && inputs.linux_start_diagnostic && inputs.public_delivery != true
    name: diagnose Linux x64 startup (not qualification)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - name: Install the startup syscall tracer
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends strace acl
      - name: Verify Linux syscall trace transport
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          const marker = 'banda-trace-preflight\n';
          const probe = spawnSync('/usr/bin/strace', [
            '--kill-on-exit', '-f', '-ttt', '-s', '4096',
            '-e', 'trace=write,writev,tgkill,tkill,kill', '/usr/bin/printf', marker,
          ], {
            encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'],
            timeout: 5000, killSignal: 'SIGKILL', maxBuffer: 64 << 10,
            env: { PATH: '/usr/bin:/bin', LANG: 'C.UTF-8' },
          });
          assert.equal(probe.error, undefined);
          assert.equal(probe.status, 0);
          assert.equal(probe.signal, null);
          assert.equal(probe.stdout, marker);
          assert.match(probe.stderr, /write(?:v)?\(1, .*banda-trace-preflight/);
          console.log('Linux strace stderr transport passed.');
          NODE
      - name: Verify the retained image run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: test "$(gh api "repos/$GH_REPO/actions/runs/43462401258" --jq .head_sha)" = 1cbab783d4996e6d12e0e858bc5c6c2a72dd073c
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: computer-images-x64
          path: ${{ runner.temp }}/computer-images
          run-id: 43462401258
          github-token: ${{ github.token }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: native-runtime-cache
        with:
          path: release/cache/computer/runtime
          key: native-runtime-linux-x64-${{ hashFiles('scripts/microvm-runtime.*', 'src/box/microvm-assets.ts') }}
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Stage the source-built runtime with verified retained images
        run: node scripts/stage.ts
        env:
          BANDA_COMPUTER_IMAGES: ${{ runner.temp }}/computer-images
      - name: Retain the verified native build before the expected failure
        if: steps.native-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: release/cache/computer/runtime
          key: native-runtime-linux-x64-${{ hashFiles('scripts/microvm-runtime.*', 'src/box/microvm-assets.ts') }}
      - name: Require native KVM access
        run: |
          test -c /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            sudo setfacl -m "u:$(id -u):rw" /dev/kvm
          fi
          test -r /dev/kvm && test -w /dev/kvm
      - name: Compare temporary ACL and activated KVM group access
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync, spawnSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { closeSync, mkdirSync, openSync, readFileSync, writeFileSync } from 'node:fs';
          import { homedir } from 'node:os';
          import { join } from 'node:path';
          import { Type } from '@earendil-works/pi-ai';
          import { Value } from 'typebox/value';
          import { assertDiagnosticIdentity, assertKvmGroup, diagnosticFile, kvmDiagnostics, parseDiagnosticIdentity, parseDiagnosticResult } from './scripts/native-diagnostics.ts';
          const DiagnosticCompletion = Type.Object({
            status: Type.Union([Type.Integer(), Type.Null()]),
            signal: Type.Union([Type.String(), Type.Null()]),
            launchError: Type.Union([Type.String(), Type.Null()]),
          });
          const source = process.cwd();
          const release = join(source, 'release/banda');
          const node = join(release, 'node/node');
          const output = join(process.env.RUNNER_TEMP, 'native-start-diagnostic');
          mkdirSync(output, { mode: 0o700 });
          const save = (name, value) => writeFileSync(join(output, name), JSON.stringify(value, null, 2));
          const manifestHash = () => createHash('sha256').update(readFileSync(join(release, 'app/computer/manifest.json'))).digest('hex');
          const aggregate = {
            qualification: false, sourceCommit: process.env.GITHUB_SHA, runtimeManifestSha256: manifestHash(),
            classification: 'inconclusive', evidenceComplete: false, arms: [],
            inferenceLimit: 'The group arm also crosses sudo policy. Retained process status may reveal policy differences. This comparison cannot identify an ACL writer or qualify Linux.',
          };
          const environment = ['PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin', `HOME=${homedir()}`, 'LANG=C.UTF-8',
            'CI=true', `BANDA_RELEASE_ROOT=${release}`, `GITHUB_SHA=${aggregate.sourceCommit}`];
          const wrapper = `
            import assert from 'node:assert/strict';
            import { spawnSync } from 'node:child_process';
            import { readFileSync, writeFileSync } from 'node:fs';
            import { join } from 'node:path';
            import { pathToFileURL } from 'node:url';
            const [source, output, arm, group] = process.argv.slice(1);
            const { assertDiagnosticIdentity, diagnosticFile, parseDiagnosticIdentity } = await import(pathToFileURL(join(source, 'scripts/native-diagnostics.ts')).href);
            const status = await diagnosticFile('/proc/self/status');
            writeFileSync(join(output, arm + '-identity.json'), JSON.stringify({ status }, null, 2));
            assert.equal(status.state, 'read');
            const identity = parseDiagnosticIdentity(status.text);
            writeFileSync(join(output, arm + '-identity.json'), JSON.stringify({ status, identity }, null, 2));
            const expected = JSON.parse(readFileSync(join(output, 'runner-identity.json'), 'utf8'));
            assertDiagnosticIdentity(identity, expected.identity, group === '' ? undefined : Number(group));
            const child = spawnSync(process.execPath, [join(source, 'scripts/diagnose-linux-start.ts'), '--out', join(output, arm), '--run'], { stdio: 'inherit' });
            writeFileSync(join(output, arm + '-diagnostic-completion.json'), JSON.stringify({
              status: child.status, signal: child.signal, launchError: child.error?.message ?? null,
            }, null, 2));
            if (child.error) console.error(child.error);
            process.exit(child.status ?? 1);
          `;
          let armAExit = 1;
          try {
            assert.equal(execFileSync('/usr/bin/git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), aggregate.sourceCommit);
            const status = await diagnosticFile('/proc/self/status');
            assert.equal(status.state, 'read');
            const identity = parseDiagnosticIdentity(status.text);
            assertDiagnosticIdentity(identity, identity);
            save('runner-identity.json', { status, identity });
            const runner = execFileSync('/usr/bin/id', ['-un'], { encoding: 'utf8' }).trim();
            assert.equal(Number(execFileSync('/usr/bin/id', ['-u', runner], { encoding: 'utf8' }).trim()), identity.uid);
            assert.equal(Number(execFileSync('/usr/bin/id', ['-g', runner], { encoding: 'utf8' }).trim()), identity.gid);
            const run = (arm, group) => {
              assert.equal(manifestHash(), aggregate.runtimeManifestSha256);
              const args = [...environment, node, '--input-type=module', '-e', wrapper, source, output, arm, group === undefined ? '' : String(group)];
              const stdout = openSync(join(output, arm + '-stdout.log'), 'wx', 0o600);
              const stderr = openSync(join(output, arm + '-stderr.log'), 'wx', 0o600);
              let child;
              try {
                child = group === undefined
                  ? spawnSync('/usr/bin/env', ['-i', ...args], { stdio: ['ignore', stdout, stderr] })
                  : spawnSync('/usr/bin/sudo', ['-n', '-u', runner, '--', '/usr/bin/env', '-i', ...args], { stdio: ['ignore', stdout, stderr] });
              } finally { closeSync(stdout); closeSync(stderr); }
              const wrapperCompletion = { status: child.status, signal: child.signal, launchError: child.error?.message ?? null };
              const entry = { arm, diagnosticCompletion: { state: 'unavailable' }, wrapperCompletion, originalFailure: { state: 'unavailable' }, startup: 'unknown', evidenceComplete: false };
              aggregate.arms.push(entry);
              save(arm + '-exit.json', { diagnosticCompletion: entry.diagnosticCompletion, wrapperCompletion });
              const completion = JSON.parse(readFileSync(join(output, arm + '-diagnostic-completion.json'), 'utf8'));
              assert.ok(Value.Check(DiagnosticCompletion, completion), 'Invalid diagnostic completion record.');
              entry.diagnosticCompletion = completion;
              if (arm === 'arm-a') armAExit = completion.status ?? 1;
              save(arm + '-exit.json', { diagnosticCompletion: completion, wrapperCompletion });
              const parsed = parseDiagnosticResult(JSON.parse(readFileSync(join(output, arm, 'result.json'), 'utf8')), aggregate);
              Object.assign(entry, { originalFailure: parsed.result.originalFailure, startup: parsed.startup, evidenceComplete: parsed.evidenceComplete, cleanup: parsed.result.cleanup });
              assert.ok(Number.isInteger(child.status) && child.signal === null && !child.error, 'Diagnostic wrapper or sudo did not complete normally.');
              assert.ok(Number.isInteger(completion.status) && completion.signal === null && completion.launchError === null, 'Diagnostic process did not complete normally.');
              assert.ok(parsed.evidenceComplete, 'Diagnostic evidence is partial; no further arm is admitted.');
              return parsed.result;
            };
            const a = run('arm-a');
            assert.ok(a.originalFailure !== null, 'Arm A did not reproduce a startup failure.');
            const device = await kvmDiagnostics();
            save('before-group-grant.json', device);
            const gid = assertKvmGroup(device, execFileSync('/usr/bin/getent', ['group', 'kvm'], { encoding: 'utf8', timeout: 5000, maxBuffer: 64 << 10, killSignal: 'SIGKILL' }));
            execFileSync('/usr/bin/sudo', ['-n', '/usr/sbin/usermod', '-aG', 'kvm', runner], { stdio: 'inherit', timeout: 5000, killSignal: 'SIGKILL' });
            const b = run('arm-b', gid);
            assert.notEqual(a.home, b.home);
            assert.notEqual(a.cache, b.cache);
            for (const key of ['binary', 'imageRef', 'configDigest']) assert.equal(a.owner[key], b.owner[key]);
            aggregate.classification = b.originalFailure === null ? 'arm-a-failed-arm-b-started' : 'both-arms-failed';
            aggregate.evidenceComplete = true;
          } catch (error) {
            aggregate.inconclusiveReason = String(error);
            console.error(error);
          } finally {
            save('comparison.json', aggregate);
            process.exitCode = armAExit || 1;
          }
          NODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-x64-start-diagnostic
          path: ${{ runner.temp }}/native-start-diagnostic
          if-no-files-found: ignore

  public-delivery:
    if: github.event_name == 'workflow_dispatch' && inputs.public_delivery
    name: verify accepted alpha.12 public delivery
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify the checkers without network requests
        run: |
          env -i PATH="$PATH" node scripts/verify-public-delivery.test.mjs
          env -i PATH="$PATH" python3 scripts/verify-public-delivery-consumer.test.py
      - name: GET and hash all 15 accepted public release assets
        run: env -i PATH="$PATH" node scripts/verify-public-delivery.mjs --out "$GITHUB_WORKSPACE/scripts/public-delivery-download" --run
      - name: Reconstruct the accepted sources and verify notice origins
        run: env -i PATH="$PATH" python3 scripts/verify-public-delivery-consumer.py --delivery "$GITHUB_WORKSPACE/scripts/public-delivery-download" --out "$GITHUB_WORKSPACE/scripts/public-delivery-consumer"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: public-delivery-alpha12-evidence
          if-no-files-found: ignore
          path: |
            scripts/public-delivery-download/result.json
            scripts/public-delivery-consumer/result.json
            scripts/public-delivery-consumer/source.log
            scripts/public-delivery-consumer/notices.log

  # The Mac and Linux downloads carry a virtual machine: a GPL kernel in LGPL firmware, and Debian guest images. This
  # job reads this run's own builds and gathers the source of what they contain and its license notices, each download
  # checked against a pinned or upstream-indexed hash, and binds the set to the downloads by SHA-256 in
  # release-materials.json (scripts/release-sources.ts). It runs whenever both supported targets were built, so a manual
  # run tries it without publishing; a tag publishes nothing without it. It holds no secret and only reads the repository.
  materials:
    if: ${{ !cancelled() && needs.build.result != 'skipped' && inputs.build_target != 'linux-x64' }}
    needs: build
    name: gather sources and notices
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: banda-mac-arm64
          path: ${{ runner.temp }}/downloads/mac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: banda-linux-x64
          path: ${{ runner.temp }}/downloads/linux
      # --consume removes each fetched source once it is inside a shard: the set is several gigabytes, twice over otherwise
      - name: Fetch, check and pack the sources and notices of both computers
        run: |
          df -h "$RUNNER_TEMP"
          node scripts/release-sources.ts --collect --consume --assets "$RUNNER_TEMP/downloads" \
            --out "$RUNNER_TEMP/materials" --cache "$RUNNER_TEMP/sources-cache"
          df -h "$RUNNER_TEMP"
      - name: Read every shard back and check the set against the downloads
        run: node scripts/release-sources.ts --verify "$RUNNER_TEMP/materials" "$RUNNER_TEMP/downloads" --deep
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: banda-materials
          path: ${{ runner.temp }}/materials
          if-no-files-found: error
          compression-level: 0

  # The supply-chain checks of docs/wallets/stack.md section 5 on the tagged tree: a release waits for them.
  supply-chain:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/supply-chain.yml

  # A tag publishes the release (a pre-release when its version has a suffix): the supported targets' downloads from this run's own builds, with their sums. The
  # browser archives ride along, since each bundled computer fetches its browser from this release by hash. Targets that
  # are built but not offered (Windows, Linux ARM64) do not hold a release back; a supported one that failed does, and
  # so does a source or notice that is missing or does not match the downloads being published.
  publish:
    if: always() && startsWith(github.ref, 'refs/tags/v')
    needs: [build, android-sign, materials, supply-chain]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The supply-chain checks passed
        run: test "${{ needs.supply-chain.result }}" = success
      - name: The tag names the version being released
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: banda-mac-arm64
          path: assets/mac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: banda-linux-x64
          path: assets/linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: banda-android-arm64
          path: assets/android
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: banda-materials
          path: materials
      # moved, not copied: with the sources the release is several gigabytes
      - name: Gather the downloads, their sources and notices, and their sums
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir upload
          find assets -type f \( -name 'banda-*.dmg' -o -name 'banda-*-mac-arm64.zip' -o -name 'banda-*.deb' \
            -o -name 'banda-cli-*.tar.gz' -o -name 'banda-browser-*.tar' -o -name 'banda-*-android-arm64.apk' \) \
            -exec mv -n -t upload -- {} +
          find materials -maxdepth 1 -type f -exec mv -n -t upload -- {} +
          for file in "banda-$version-mac-arm64.dmg" "banda-$version-linux-amd64.deb" \
            "banda-cli-$version-mac-arm64.tar.gz" "banda-cli-$version-linux-x64.tar.gz" "banda-$version-android-arm64.apk" \
            release-materials.json RELEASE-SOURCES.md "banda-$version-notices.tar" "banda-$version-sources-01.tar"; do
            test -f "upload/$file"
          done
          test "$(find upload -name 'banda-browser-*.tar' | wc -l)" -eq 2
          (cd upload && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      # no shared cache is restored into the job that holds the release's token
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # this step runs dependencies' code, so it is given no token and no install script runs
      - name: Refuse a release whose sources and notices are missing or do not match its downloads
        run: |
          npm ci --ignore-scripts
          node scripts/release-sources.ts --verify upload
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release exists; its artifacts are unchanged."
            exit 0
          fi
          # a version with a suffix (v0.1.0-alpha.15, v0.1.0-rc.1) is a pre-release; v0.1.0 is the latest release
          kind=--latest
          case "$GITHUB_REF_NAME" in *-*) kind=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" upload/* \
            "$kind" --verify-tag \
            --title "banda $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
      # a release this workflow's token publishes raises no release event, so the landing is told directly
      - name: Refresh the landing's downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run site-downloads.yml --ref main
