# The desktop app's installers. The release tree (release/banda/, from scripts/stage.ts) ships beside the app as
# resources/banda: the bundled Node.js runs the daemon from there, outside the asar archive.
appId: app.banda.desktop
productName: banda
copyright: banda's authors, AGPL-3.0-only
directories:
  output: ../release/desktop
  buildResources: build
files:
  - dist/**
  - package.json
extraResources:
  - from: ../release/banda
    to: banda
icon: ../web/public/icon-512.png
artifactName: banda-${version}-${os}-${arch}.${ext}
publish: null
mac:
  category: public.app-category.productivity
  target: [dmg, zip]
  # No Developer ID yet: sign ad hoc, so the bundle's seal is whole. Left unsigned, Electron's linker signature no longer
  # matches the bundle, and Apple silicon calls a downloaded copy "damaged" with no Open Anyway. Ad-hoc signing has no
  # Team ID, so library validation (hardened runtime) would refuse Electron's own frameworks.
  identity: "-"
  hardenedRuntime: false
win:
  target: [nsis]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  category: Utility
  target: [AppImage, deb]
  maintainer: banda
